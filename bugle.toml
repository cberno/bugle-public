# ──────────────────────────────────────────────────────────────────────────
#  YOUR NEWSPAPER
#  Everything that makes the paper yours lives in this file. Edit it on
#  GitHub (click the file, then the pencil icon) and the next edition obeys.
# ──────────────────────────────────────────────────────────────────────────

[paper]
# The masthead. Anything you like: "The Smith Sentinel", "Daily Dachshund".
# Long names shrink to fit; under about 24 characters looks best.
name = "The Morning Bugle"

# Printed in the dateline after the date, e.g. "Hometown Edition".
edition = "Hometown Edition"

# The line at the bottom of every page.
motto = "Do something you will be proud of today."

# Vol. I. The volume number counts up by one every day from here.
launch_date = 2026-12-01

# Your time zone (IANA name): America/New_York, America/Chicago,
# America/Denver, America/Los_Angeles, Europe/London, ...
# If you are not on Eastern time, also change the three `timezone:` lines
# in .github/workflows/bugle.yml so the paper prints at your 4am.
timezone = "America/New_York"


[location]
# Roughly where you live. Two decimal places is plenty (about half a mile)
# and keeps your exact address out of the code. Find yours by right-clicking
# your neighborhood in Google Maps. West and south are negative.
latitude = 38.90      # CHANGE ME — these defaults are downtown Washington, DC
longitude = -77.04

# How the editor should think of where you live.
description = "Washington, DC"


[household]
# Who reads the paper, in a sentence. The editor uses this for tone and
# context. It never prints names in the weather section.
description = "a family of four and a beagle"

# The editorial voice in a few words.
voice = "dry, warm, terse"


[local_news]
# Section header on weekdays and weekends.
desk_name = "Local News"
weekend_desk_name = "Local News — Weekend"

# RSS feeds for the local desk, most local first. Neighborhood blogs and
# local papers beat wire services. Most news sites have a feed at /feed/ or
# /rss; search "<site name> RSS" if not. Three or four feeds is plenty.
feeds = [            # CHANGE ME — these defaults are Washington, DC sources
  "https://www.popville.com/feed/",
  "https://wtop.com/feed/",
]

# The places the editor should favor, closest first. Plain English.
focus = """Prefer stories from the neighborhoods closest to home; then citywide
stories that touch daily life there. Neighborhood sources outrank wire copy
when they carry real news."""


[grounds]
# Optional. The Bird of the Day runs whenever eBird has a nearby sighting
# with a good photo. On the rare day it can't, the bottom section becomes a
# short "Grounds Report" about your yard, written from this description.
# Leave it empty and the editor writes a seasonal note about your area instead.
description = ""
# Example:
# description = """A small backyard with a Japanese maple, hydrangeas, a
# vegetable bed, a bird bath, and a patch of clover lawn."""
